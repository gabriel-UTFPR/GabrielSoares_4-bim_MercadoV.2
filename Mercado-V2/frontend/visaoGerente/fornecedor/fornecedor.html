<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD fornecedor</title>
    <link rel="stylesheet" href="fornecedor.css">
</head>

<body onload="listar()">
    <header>
        <img src="http://localhost:3001/imagens/carrinho.png" alt="Carrinho de compras">
        <h1>Cadastro de fornecedores</h1>
        <p>Gerencie fornecedores do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do fornecedor</h2>
                
                <label for="inputId_fornecedor">ID</label>
                <div class="linha-id">
                    <input type="number" name="inputId_fornecedor" id="inputId_fornecedor"  placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_fornecedor">Nome do fornecedor</label>
                <input type="text" name="inputNome_fornecedor" id="inputNome_fornecedor" placeholder="Ex: Nestlé">
             
                <label for="inputCnpj">Cnpj</label>
                <input type="text" name="inputCnpj" id="inputCnpj" placeholder="Ex: 00.000.000/0000-00">
                
                <label for="inputTelefone">Telefone</label>
                <input type="text" name="inputTelefone" id="inputTelefone" placeholder="Ex: (44) 99999-9999">
                
                <label for="inputEmail">Email</label>
                <input type="text" name="inputEmail" id="inputEmail"
                placeholder="Ex: exemplo@email.com">
                
                <label for="inputEndereco">Endereço</label>
                <input type="text" name="inputEndereco" id="inputEndereco" placeholder="Ex: Rua, número, bairro">

                <div id="divAviso">Informe o Id e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-filmes">
            <h3>Fornecedores Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Fornecedores - Gabriel S. M32 - Todos os direitos reservados.</p>
    </footer>

    <script src="./fornecedor.js"></script>
</body>

</html>
